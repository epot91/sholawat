 <div class="login-circle" id="loginContainer">
        
        <!-- Animated Success Message -->
        <div class="success-msg" id="successMsg">
            <div class="check-circle">✓</div>
            <h2>Welcome Back!</h2>
            <p style="color: var(--text-color); font-weight: normal; margin-top: 5px;">Login Successful</p>
        </div>

        <!-- The Form Elements -->
        <div class="form-content" id="formContent">
            <h2>SIGN IN</h2>
            <p class="hint">(Use admin / 1234 to test success)</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <button class="btn-submit" onclick="handleLogin()">Login</button>
        </div>
        
    </div>
