<div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class=scene>
    <div class=neon-ring-2></div>
    <div class=neon-ring></div>
    <div class=card id=card>
      <div class="card-face front">
        <form class=form id=loginForm>
          <h1>WELCOME</h1>
          <div class=form-subtitle>
            Login to your account
          </div>
          <div class=input-box>
            <input type=email id=loginEmail placeholder=" " required>
            <label>Email Address</label>
          </div>
          <div class="input-box password-box">
            <input type=password id=loginPassword placeholder=" " required>
            <label>Password</label>
            <span class=password-toggle onclick='togglePassword("loginPassword",this)'>
              👁
            </span>
          </div>
          <div class=options>
            <label>
              <input type=checkbox>
              Remember me
            </label>
            <a href=#>
              Forgot?
            </a>
          </div>
          <button class=btn id=loginBtn type=submit>
            LOGIN
          </button>
          <div class=message id=loginMessage></div>
          <div class=switch>
            Don't have an account?
            <span onclick=showSignup()>
              Sign Up
            </span>
          </div>
        </form>
      </div>
      <div class="card-face back">
        <form class=form id=signupForm>
          <h1>SIGN UP</h1>
          <div class=form-subtitle>
            Create your account
          </div>
          <div class=input-box>
            <input id=signupName placeholder=" " required>
            <label>Full Name</label>
          </div>
          <div class=input-box>
            <input type=email id=signupEmail placeholder=" " required>
            <label>Email Address</label>
          </div>
          <div class="input-box password-box">
            <input type=password id=signupPassword placeholder=" " required>
            <label>Password</label>
            <span class=password-toggle onclick='togglePassword("signupPassword",this)'>
              👁
            </span>
          </div>
          <button class=btn id=signupBtn type=submit>
            CREATE ACCOUNT
          </button>
          <div class=message id=signupMessage></div>
          <div class=switch>
            Already have an account?
            <span onclick=showLogin()>
              Login
            </span>
          </div>
        </form>
      </div>
    </div>
  </div>
